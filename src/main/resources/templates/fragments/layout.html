<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17191c">
    <title th:text="|${title} · Navaja Barber Studio|">Navaja Barber Studio</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="topbar(title, subtitle)" class="topbar">
    <button class="menu-toggle" type="button" aria-label="Abrir navegación" data-menu-toggle>☰</button>
    <div>
        <p class="topbar-title" th:text="${title}">Panel</p>
        <p class="topbar-subtitle" th:text="${subtitle}">Administración de barbería</p>
    </div>
    <div class="topbar-right">
        <span class="today-label">Administración</span>
        <span class="avatar" aria-label="Administración">N</span>
    </div>
</header>

<div th:fragment="shell(title, active, pageContent)" class="app-shell">
    <div class="mobile-overlay" data-mobile-overlay></div>
    <div th:replace="~{fragments/sidebar :: sidebar(${active})}"></div>
    <div class="workspace">
        <div th:replace="~{fragments/layout :: topbar(${title}, 'Administración de barbería')}"></div>
        <div class="page-content">
            <div th:replace="${pageContent}">
                <main></main>
            </div>
        </div>
    </div>
    <script th:src="@{/js/app.js}" defer></script>
</div>
</body>
</html>
