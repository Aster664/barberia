<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${servicio.idServicio == null ? 'Nuevo servicio' : 'Editar servicio'})}"></head>
<body>
<div th:replace="~{fragments/layout :: shell('Servicios', 'servicios', ~{::content})}">
    <main th:fragment="content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <div class="page-heading"><div><p class="eyebrow">Catálogo</p><h1 class="page-title" th:text="${servicio.idServicio == null ? 'Nuevo servicio' : 'Editar servicio'}">Servicio</h1><p class="page-description">Indica el nombre, duración y tarifa del servicio.</p></div></div>
        <form class="card form-card" method="post" th:object="${servicio}" th:action="@{${servicio.idServicio == null ? '/servicios/guardar' : '/servicios/' + servicio.idServicio + '/actualizar'}}">
            <h2 class="form-section-title">Información del servicio</h2>
            <div class="form-grid">
                <div class="field field-full"><label for="nombre">Nombre *</label><input id="nombre" name="nombre" type="text" maxlength="120" required th:value="*{nombre}"></div>
                <div class="field field-full"><label for="descripcion">Descripción</label><textarea id="descripcion" name="descripcion" th:text="*{descripcion}"></textarea></div>
                <div class="field"><label for="duracionMinutos">Duración (minutos) *</label><input id="duracionMinutos" name="duracionMinutos" type="number" min="1" step="1" required th:value="*{duracionMinutos}"></div>
                <div class="field"><label for="precio">Precio *</label><input id="precio" name="precio" type="number" min="0" step="0.01" required th:value="*{precio}"></div>
                <div class="field" th:if="${servicio.idServicio != null}"><label for="estado">Estado *</label><select id="estado" name="estado" required><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}" th:selected="${servicio.estado == estado}">ACTIVO</option></select></div>
            </div>
            <p class="callout" th:if="${servicio.idServicio == null}">El estado inicial se establece automáticamente como activo.</p>
            <div class="form-actions"><a class="btn btn-outline" th:href="@{/servicios}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar servicio</button></div>
        </form>
    </main>
</div>
</body>
</html>
