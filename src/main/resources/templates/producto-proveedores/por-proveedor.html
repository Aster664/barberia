<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos del proveedor')}"></head>
<body>
<div th:replace="~{fragments/layout :: shell('Proveedores', 'proveedores', ~{::content})}">
    <main th:fragment="content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <div class="page-heading"><div><p class="eyebrow">Abastecimiento · Proveedor</p><h1 class="page-title" th:text="|Productos de ${proveedor.nombre}|">Productos del proveedor</h1><p class="page-description">Consulta y administra el catálogo asociado al proveedor.</p></div><div class="heading-actions"><a class="btn btn-outline" th:href="@{/proveedores/{id}(id=${proveedor.idProveedor})}">Volver al proveedor</a></div></div>
        <section class="card table-card">
            <form class="filter-row" method="post" th:action="@{/proveedores/{idProveedor}/productos/asociar(idProveedor=${proveedor.idProveedor})}">
                <div class="field"><label for="idProducto">Agregar producto</label><select id="idProducto" name="idProducto" required><option value="">Selecciona un producto</option><option th:each="producto : ${productosPorId.values()}" th:value="${producto.idProducto}" th:disabled="${#lists.contains(asociaciones.![idProducto], producto.idProducto)}" th:text="|${producto.nombre}${#lists.contains(asociaciones.![idProducto], producto.idProducto) ? ' · Ya asociado' : ''}|">Producto</option></select></div><button class="btn btn-primary btn-small" type="submit">Asociar</button>
            </form>
            <div class="table-toolbar"><p th:text="|${#lists.size(asociaciones)} productos asociados|">Productos</p></div>
            <div class="table-wrap"><table><thead><tr><th>Producto</th><th>Precio compra</th><th>Existencia</th><th>Acciones</th></tr></thead><tbody>
                <tr th:each="asociacion : ${asociaciones}" th:with="producto=${productosPorId[asociacion.idProducto]}">
                    <td><a class="table-primary" th:href="@{/productos/{id}(id=${producto.idProducto})}" th:text="${producto.nombre}">Producto</a></td><td th:text="|$ ${producto.precioCompra}|">Compra</td><td th:text="${producto.cantidadDisponible}">Stock</td>
                    <td><form method="post" th:action="@{/proveedores/{idProveedor}/productos/{idProducto}/desasociar(idProveedor=${proveedor.idProveedor},idProducto=${asociacion.idProducto})}" data-confirm="¿Desasociar este producto del proveedor?"><button class="btn btn-danger btn-small" type="submit">Desasociar</button></form></td>
                </tr>
                <tr th:if="${#lists.isEmpty(asociaciones)}"><td colspan="4"><div class="empty-state"><strong>Sin productos asociados</strong><p>Usa el selector para agregar productos de este proveedor.</p></div></td></tr>
            </tbody></table></div>
        </section>
    </main>
</div>
</body>
</html>
