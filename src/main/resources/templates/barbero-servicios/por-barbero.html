<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Servicios del barbero')}"></head>
<body>
<div th:replace="~{fragments/layout :: shell('Barberos', 'barberos', ~{::content})}">
    <main th:fragment="content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <div class="page-heading"><div><p class="eyebrow">Equipo · Especialidades</p><h1 class="page-title" th:text="|Servicios de ${barbero.nombres} ${barbero.apellidos}|">Servicios del barbero</h1><p class="page-description">Asocia los servicios que este profesional puede realizar.</p></div><div class="heading-actions"><a class="btn btn-outline" th:href="@{/barberos/{id}(id=${barbero.idBarbero})}">Volver al barbero</a></div></div>
        <section class="card table-card">
            <form class="filter-row" method="post" th:action="@{/barberos/{idBarbero}/servicios/asociar(idBarbero=${barbero.idBarbero})}">
                <div class="field"><label for="idServicio">Agregar servicio</label><select id="idServicio" name="idServicio" required><option value="">Selecciona un servicio</option><option th:each="servicio : ${serviciosPorId.values()}" th:value="${servicio.idServicio}" th:disabled="${#lists.contains(asociaciones.![idServicio], servicio.idServicio)}" th:text="|${servicio.nombre}${#lists.contains(asociaciones.![idServicio], servicio.idServicio) ? ' · Ya asociado' : ''}|">Servicio</option></select></div><button class="btn btn-primary btn-small" type="submit">Asociar</button>
            </form>
            <div class="table-toolbar"><p th:text="|${#lists.size(asociaciones)} servicios asociados|">Servicios</p></div>
            <div class="table-wrap"><table><thead><tr><th>Servicio</th><th>Precio</th><th>Duración</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>
                <tr th:each="asociacion : ${asociaciones}" th:with="servicio=${serviciosPorId[asociacion.idServicio]}">
                    <td><a class="table-primary" th:href="@{/servicios/{id}(id=${servicio.idServicio})}" th:text="${servicio.nombre}">Servicio</a></td><td th:text="|$ ${servicio.precio}|">Precio</td><td th:text="|${servicio.duracionMinutos} min|">Duración</td><td th:text="${servicio.estado}">Estado</td>
                    <td><form method="post" th:action="@{/barberos/{idBarbero}/servicios/{idServicio}/desasociar(idBarbero=${barbero.idBarbero},idServicio=${asociacion.idServicio})}" data-confirm="¿Desasociar este servicio del barbero?"><button class="btn btn-danger btn-small" type="submit">Desasociar</button></form></td>
                </tr>
                <tr th:if="${#lists.isEmpty(asociaciones)}"><td colspan="5"><div class="empty-state"><strong>Sin servicios asociados</strong><p>Utiliza el selector para agregar especialidades.</p></div></td></tr>
            </tbody></table></div>
        </section>
    </main>
</div>
</body>
</html>
