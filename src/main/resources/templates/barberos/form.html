<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${barbero.idBarbero == null ? 'Nuevo barbero' : 'Editar barbero'})}"></head>
<body>
<div th:replace="~{fragments/layout :: shell('Barberos', 'barberos', ~{::content})}">
    <main th:fragment="content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <div class="page-heading"><div><p class="eyebrow">Equipo</p><h1 class="page-title" th:text="${barbero.idBarbero == null ? 'Nuevo barbero' : 'Editar barbero'}">Nuevo barbero</h1><p class="page-description">Completa la información del profesional.</p></div></div>
        <form class="card form-card" method="post" th:object="${barbero}" th:action="@{${barbero.idBarbero == null ? '/barberos/guardar' : '/barberos/' + barbero.idBarbero + '/actualizar'}}">
            <h2 class="form-section-title">Información personal y laboral</h2>
            <div class="form-grid">
                <div class="field"><label for="nombres">Nombres *</label><input id="nombres" name="nombres" type="text" maxlength="100" required th:value="*{nombres}"></div>
                <div class="field"><label for="apellidos">Apellidos *</label><input id="apellidos" name="apellidos" type="text" maxlength="100" required th:value="*{apellidos}"></div>
                <div class="field"><label for="documentoIdentidad">Documento de identidad *</label><input id="documentoIdentidad" name="documentoIdentidad" type="text" maxlength="30" required th:value="*{documentoIdentidad}"></div>
                <div class="field"><label for="telefono">Teléfono</label><input id="telefono" name="telefono" type="tel" th:value="*{telefono}"></div>
                <div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" maxlength="150" th:value="*{email}"></div>
                <div class="field"><label for="fechaContratacion">Fecha de contratación</label><input id="fechaContratacion" name="fechaContratacion" type="date" th:value="*{fechaContratacion}"></div>
                <div class="field"><label for="porcentajeComision">Comisión (%)</label><input id="porcentajeComision" name="porcentajeComision" type="number" min="0" max="100" step="0.01" th:value="*{porcentajeComision}"></div>
                <div class="field" th:if="${barbero.idBarbero != null}"><label for="estado">Estado *</label><select id="estado" name="estado" required><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}" th:selected="${barbero.estado == estado}">ACTIVO</option></select></div>
            </div>
            <p class="callout" th:if="${barbero.idBarbero == null}">El estado inicial se establece automáticamente como activo.</p>
            <div class="form-actions"><a class="btn btn-outline" th:href="@{/barberos}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar barbero</button></div>
        </form>
    </main>
</div>
</body>
</html>
